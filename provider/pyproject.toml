[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticwf-auth-logto"
version = "0.1.0"
description = "Logto provider of the AgenticWF auth service (agenticwf-auth-server from AgenticWF-auth)"
requires-python = ">=3.11"
dependencies = [
    "agenticwf-auth-server",   # AgenticWF-auth authsvc/
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
