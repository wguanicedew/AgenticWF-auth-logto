name: Build container

# Build and publish the AlmaLinux 9 identity container whenever a tag is pushed.
on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agenticwf-auth-logto
  LOGTO_VERSION: "1.44.0"
  # The provider-neutral auth service (agenticwf-auth-server) this image is built with.
  AUTH_REPOSITORY: InnovateAILab/AgenticWF-auth
  AUTH_REF: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.AUTH_REPOSITORY }}
          ref: ${{ env.AUTH_REF }}
          path: AgenticWF-auth
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test the Logto provider
        run: |
          pip install -e 'AgenticWF-auth/authsvc[test]' -e 'provider[test]'
          cd provider && pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.AUTH_REPOSITORY }}
          ref: ${{ env.AUTH_REF }}
          path: AgenticWF-auth

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Dockerfile
          build-contexts: |
            agenticwf-auth=./AgenticWF-auth
          # Logto's prebuilt release ships linux-x64-gnu native modules.
          platforms: linux/amd64
          build-args: |
            LOGTO_VERSION=${{ env.LOGTO_VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
